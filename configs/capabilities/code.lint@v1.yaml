capability_name: code.lint@v1
description: Run a linter on a code repository
adapter_type: local
side_effect_level: local  # fix=true modifies files in place
requires_approval_default: false
timeout_ms: 120000
input_schema:
  type: object
  additionalProperties: false
  required: [repo_path]
  properties:
    repo_path:
      type: string
      description: Absolute path to the git repository
    tool:
      type: string
      enum: [ruff]
      description: Linter to use (default ruff)
    paths:
      type: array
      items:
        type: string
      description: Specific paths to lint
    fix:
      type: boolean
      description: Auto-fix issues where possible
output_schema:
  type: object
  properties:
    tool:
      type: string
    issue_count:
      type: integer
    issues:
      type: array
      items:
        type: object

capability_name: deps.audit.python@v1
description: Audit Python dependencies for outdated packages and vulnerabilities
adapter_type: local
side_effect_level: none
requires_approval_default: false
timeout_ms: 60000
input_schema:
  type: object
  additionalProperties: false
  required: [repo_path]
  properties:
    repo_path:
      type: string
      description: Absolute path to the git repository
    check_outdated:
      type: boolean
      description: Check for outdated packages (default true)
    check_vulnerabilities:
      type: boolean
      description: Check for known vulnerabilities via pip-audit (default true)
output_schema:
  type: object
  properties:
    language:
      type: string
    outdated_count:
      type: integer
    vulnerability_count:
      type: integer

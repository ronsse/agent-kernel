# =============================================================================
# Capability: notes.update@v1
# =============================================================================
# Update an existing note.

capability_name: notes.update@v1
description: Update an existing note's title, content, or metadata

input_schema:
  type: object
  required:
    - note_id
  properties:
    note_id:
      type: string
      description: The unique note identifier
    title:
      type: string
      maxLength: 500
      description: New title
    content:
      type: string
      description: New content
    project_id:
      type: string
      description: New project ID
    folder:
      type: string
      description: New folder
    tags:
      type: array
      items:
        type: string
      description: New tags (replaces existing)

output_schema:
  type: object
  properties:
    note:
      type: object
      description: Updated note object
    error:
      type: string
      description: Error message if note not found

# Side effect classification
side_effect_level: local

# Default approval requirement
requires_approval_default: false

# Execution limits
timeout_ms: 5000
rate_limit:
  max_calls: 50
  window_seconds: 60

# Adapter configuration
adapter_type: local
adapter_config: {}

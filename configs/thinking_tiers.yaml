# =============================================================================
# Thinking Tier Configuration
# =============================================================================
# Defines reasoning budget tiers for the ThinkingPolicyController.
# See docs/design/11-thinking-policy.md for details.

tiers:
  0:
    name: "routing"
    description: "Classification, routing, simple extraction"
    model: "gpt-4o-mini"
    reasoning_effort: "low"
    max_tokens: 500
    run_critic: false
    generate_candidates: 1

  1:
    name: "standard"
    description: "Normal planning, most tasks"
    model: "gpt-4o"
    reasoning_effort: "medium"
    max_tokens: 2000
    run_critic: false
    generate_candidates: 1

  2:
    name: "deep"
    description: "Complex analysis, ambiguous tasks"
    model: "gpt-4o"
    reasoning_effort: "high"
    max_tokens: 4000
    run_critic: false
    generate_candidates: 1

  3:
    name: "deep_with_critic"
    description: "High stakes, requires verification"
    model: "gpt-4o"
    reasoning_effort: "high"
    max_tokens: 4000
    run_critic: true
    generate_candidates: 1

  4:
    name: "multi_candidate"
    description: "Highest stakes, multiple candidates with judge"
    model: "gpt-4o"
    reasoning_effort: "high"
    max_tokens: 4000
    run_critic: true
    generate_candidates: 3

# Triggers that cause escalation to a higher tier
escalation_triggers:
  # Escalate if schema validation fails
  schema_validation_failed: true
  
  # Escalate if quality gates fail
  quality_gates_failed: true
  
  # Escalate if confidence is below this threshold
  confidence_below_threshold: 0.7
  
  # Escalate if risk level is high
  risk_level_high: true
  
  # Escalate if user explicitly requests deep analysis
  explicit_deep_analysis: true
